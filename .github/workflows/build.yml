name: Relationship OS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  relationship-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Relationship OS
        run: node src/relationship.js